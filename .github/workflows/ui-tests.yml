name: UI Tests

# Runs the suite on GitHub's macOS runners with `runTests.sh`, the same way as
# locally: xcodebuild and the simulator share one Mac, so StoreKit's local test
# environment (SKTestSession, Products.storekit) works as it does locally.
#
# One job builds every scheme for testing; the test jobs reuse those products,
# each running its share of one scheme's tests (SHARD_INDEX of SHARD_COUNT) on
# `simulators` simulators. GitHub runs as many jobs at once as the plan allows
# (macOS jobs are the limit) and queues the rest.

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Test numbers to run (space separated), empty for all
        default: ""
      simulators:
        description: Simulators per job (the hosted runners are too small for more than 1)
        default: "1"
  push:
    branches:
      - ci/github-actions-ui-tests

env:
  DERIVED_DATA: build-output
  # TEMPORARY: pushes to the CI branch rerun only the tests that failed on the
  # hosted runners, while they're being fixed.
  TESTS: ${{ github.event_name == 'push' && '17 59 108 109 112 122 149' || inputs.tests }}
  # Requests that weren't answered from Fixtures/, to see what a slow paywall waits on.
  TEST_RUNNER_SWK_FIXTURES_LOG: ${{ github.workspace }}/test-results/network.log

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reuse the previous run's DerivedData (Swift packages and their compiled
      # modules). Checkout gives every file a new modification time, which
      # would make Xcode rebuild everything, so sources get their last commit's
      # time back first: unchanged files then count as up to date.
      - name: Restore source modification times
        run: |
          git ls-files -z -- '*.swift' '*.m' '*.h' '*.storyboard' '*.plist' '*.xcassets/*' |
            while IFS= read -r -d '' file; do
              touch -t "$(git log -1 --format=%cd --date=format:%Y%m%d%H%M.%S -- "$file")" "$file"
            done

      - uses: actions/cache@v4
        with:
          path: build-output
          key: derived-data-xcode27-${{ hashFiles('UI Tests.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            derived-data-xcode27-${{ hashFiles('UI Tests.xcodeproj/project.pbxproj') }}-
            derived-data-xcode27-

      - name: Build for testing
        run: BUILD_ONLY=1 SHARDS=1 ./runTests.sh

      # Artifacts don't keep file permissions, so the products travel as a tarball.
      - name: Pack build products
        run: tar -czf products.tgz -C build-output/Build Products

      - uses: actions/upload-artifact@v4
        with:
          name: products
          path: products.tgz
          retention-days: 3

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: test-results/build.log

  test:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - UI Tests -swift -automatic
          - UI Tests -swift -advanced
          - UI Tests -objc -automatic
          - UI Tests -objc -advanced
        shard: [0, 1, 2, 3, 4]
    name: ${{ matrix.scheme }} (${{ matrix.shard }})
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 5
      SHARDS: ${{ inputs.simulators || '1' }}
      SKIP_BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: products

      - name: Unpack build products
        run: mkdir -p build-output/Build && tar -xzf products.tgz -C build-output/Build

      - name: Run UI tests
        run: ./runTests.sh "${{ matrix.scheme }}"

      - name: Name results
        if: always()
        run: echo "ARTIFACT=results-$(echo '${{ matrix.scheme }}' | tr -c 'a-zA-Z0-9\n' '-')-${{ matrix.shard }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.ARTIFACT }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
